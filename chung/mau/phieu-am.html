<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phiếu bài tập · {{NHAN}} · Trường Tiếng Việt Của Em</title>
<link rel="icon" type="image/png" href="../chung/img/trau-con.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:ital,wght@0,600;0,800;0,900;1,600&display=swap" rel="stylesheet">
<style>
:root{--paper:#F4F0EA; --ink:#2A231F; --soft:#64574C; --charcoal:#3A3B3C; --straw:#DDAA55; --straw-soft:#F6E3BC; --wood:#C68B59; --line:#DCCFBC; --oli:#9CC3DE}
@page{size:letter; margin:0}
*{box-sizing:border-box}
body{margin:0; background:var(--paper); font:600 15px/1.35 Nunito,"Segoe UI",Arial,sans-serif; color:var(--ink); -webkit-print-color-adjust:exact; print-color-adjust:exact}
.bar{ display:flex; justify-content:center; gap:12px; padding:10px; background:var(--paper)}
.bar button{font:800 17px/1 Nunito,sans-serif; padding:12px 22px; border:3px solid var(--charcoal); border-radius:999px; background:var(--straw); box-shadow:0 3px 0 var(--charcoal); cursor:pointer}
.page{position:relative; width:8.5in; height:11in; margin:0 auto 18px; padding:.4in .5in .5in; background:#fff; overflow:hidden; display:flex; flex-direction:column; gap:10px; box-shadow:0 6px 20px -10px rgba(0,0,0,.4)}
header{display:flex; align-items:center; gap:12px; padding-bottom:8px; border-bottom:3px solid var(--straw)}
header img{width:56px}
header p{margin:0; font:800 12px/1.2 "Baloo 2",Nunito,sans-serif; letter-spacing:.5px; text-transform:uppercase; color:var(--wood)}
header h1{margin:0; font:800 28px/1.1 "Baloo 2",Nunito,sans-serif; color:var(--charcoal)}
header>div:nth-child(2){flex:1}
.who{font-weight:800; line-height:2}
.who i,.sign i,.lines i{display:inline-block; width:2.1in; border-bottom:1.5px dotted var(--soft); margin-left:4px}
section{border:2px solid var(--line); border-radius:14px; padding:8px 12px 10px}
h2{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; margin:0 0 6px; font:800 18px/1.2 "Baloo 2",Nunito,sans-serif; color:var(--charcoal)}
h2 small{font:italic 600 12.5px/1 Nunito,sans-serif; color:var(--soft)}
h2 .n{display:inline-grid; place-items:center; width:26px; height:26px; border-radius:50%; background:var(--charcoal); color:var(--straw); font-size:15px; flex:none}
svg{display:block}
.read{display:flex; align-items:center; gap:14px}
.am-big{font:900 64px/1 Nunito,sans-serif; text-align:center; min-width:64px}
.read.bon .am-big{font-size:50px; min-width:50px}
.read.bon .key span{white-space:nowrap; font-size:15px}
.am-big small{display:block; font-size:22px; color:var(--soft)}
.keys{flex:1; display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
.key{text-align:center}
.key .kp{width:72px; height:72px; margin:0 auto}
.key .kp svg,.fp svg,.mp svg,.sp svg{width:100%; height:100%}
.key b{display:block; font:900 24px/1.1 Nunito,sans-serif}
.key span{font:800 17px/1.1 Nunito,sans-serif}
.wordline{display:flex; flex-wrap:wrap; gap:6px 22px; justify-content:center; margin:8px 0 0; font:800 23px/1.2 Nunito,sans-serif}
.wordline span::after{content:" ☐"; font-size:16px; color:var(--soft)}
.match{display:grid; grid-template-columns:auto 1fr auto; gap:2px 0; align-items:center; padding:0 20px}
.mw{display:flex; align-items:center; gap:10px; font:800 25px/1 Nunito,sans-serif}
.mp{display:flex; align-items:center; gap:10px; width:90px; height:60px}
.mp svg{width:58px; height:58px}
.mw i,.mp i{width:11px; height:11px; border-radius:50%; background:var(--charcoal); flex:none}
.choose{margin:0 0 4px; text-align:center; font:800 20px/1 Nunito,sans-serif}
.choose b{display:inline-block; padding:2px 12px; border:2px solid var(--charcoal); border-radius:10px}
.fills{display:grid; grid-template-columns:repeat(4,1fr); gap:10px}
.fi{text-align:center}
.fp{width:90px; height:90px; margin:0 auto}
.fw{font:800 25px/1.2 Nunito,sans-serif; white-space:nowrap}
.fw u{display:inline-block; width:30px; height:30px; margin-right:2px; border:2px dashed var(--charcoal); border-radius:6px; vertical-align:-6px}
.fw u[class^=dau]{width:54px; margin:0 2px}
.sylls{display:flex; flex-wrap:wrap; justify-content:center; gap:10px 26px; margin:6px 0 2px; font:800 26px/1.3 Nunito,sans-serif}
.sents{display:grid; gap:2px}
.sent{display:flex; align-items:center; gap:12px}
.sp{width:46px; height:46px; flex:none}
.sent p{flex:1; margin:0; font:800 23px/1.2 Nunito,sans-serif}
.tick{width:22px; height:22px; border:2px solid var(--charcoal); border-radius:5px}
/* ô li vẽ bằng SVG: mỗi ô li khoảng 2 mm như vở; chữ mẫu là nét chữ viết thường chuẩn, chữ chấm mờ để tô */
.oli{display:block; width:100%; height:auto; margin:0}
.lines div{margin:4px 0; font:800 19px/1.6 Nunito,sans-serif}
.lines i{width:1.5in; margin:0 10px}
.lines.hai{display:grid; grid-template-columns:1fr 1fr; column-gap:12px}
.lines.hai i{width:.85in; margin:0 5px}
.self table{width:100%; border-collapse:collapse}
.self td{padding:1px 6px; font-weight:800; font-size:15.5px}
.self td small{display:block; font:italic 600 12px/1.2 Nunito,sans-serif; color:var(--soft)}
.self td svg{width:26px; height:26px; margin:0 auto}
.parent{display:flex; gap:14px; align-items:center; background:var(--straw-soft); border-color:var(--straw)}
.parent>div{flex:1}
.parent h2{margin-bottom:2px}
.parent p{margin:3px 0; font-size:13px; line-height:1.35}
.parent p i{color:var(--soft)}
.parent figure{margin:0; text-align:center; font:800 12px/1.2 Nunito,sans-serif}
.parent figure svg{width:.95in; height:.95in; background:#fff; padding:4px; border-radius:6px}
.sign i{width:2.4in}
footer{position:absolute; left:.5in; right:.5in; bottom:.25in; display:flex; justify-content:space-between; font:700 11px/1 Nunito,sans-serif; color:var(--soft)}
@media print{ body{background:#fff} .bar{display:none} .page{margin:0; box-shadow:none; page-break-after:always} }
@media screen and (max-width:830px){ .page{transform-origin:top left; } }
</style>
</head>
<body>
<div class="bar"><button type="button" onclick="window.print()">In phiếu bài tập</button><button type="button" onclick="location.reload()">Đổi bài tập khác</button></div>
<div id="phieu"></div>
<script>
{{JS}}
</script>
</body>
</html>
