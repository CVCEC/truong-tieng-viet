# Mỗi lần kho có thay đổi trên nhánh main: đóng gói mọi bài rồi đăng lên GitHub Pages (baihoc.cvcec.org).
name: Đăng website bài học
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Mỗi giờ dựng lại một lần để video mới đưa lên Cloudflare R2 tự hiện trên trang
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  dang:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/build.mjs
        env:
          TU_TIM_VIDEO: '1'
      - run: echo "baihoc.cvcec.org" > site/CNAME && touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # GitHub đôi khi chưa thấy gói vừa tải lên ("Found 0 artifact(s)"): đợi rồi đăng lại một lần
      - id: deploy1
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deploy1.outcome == 'failure'
        run: sleep 30
      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4
